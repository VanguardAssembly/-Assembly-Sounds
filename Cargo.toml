[package]
name = "focus_binaural"
version = "1.7.0"
edition = "2024"
description = "Binaural / monaural / isochronic beat generator with Gateway-inspired guided sessions and natural voice cues"
license = "MIT"

[[bin]]
name = "FocusBinaural"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
include_dir = "0.7.4"
lewton = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.3"
wry = "0.57.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
