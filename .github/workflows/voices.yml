name: Narration

# Renders any spoken cues in tools/cues.json that don't have a clip yet, with the
# Kokoro-82M text-to-speech model (Apache-2.0), one job per voice, then commits voice/.
# Run it by hand after adding or changing cues:  gh workflow run voices.yml
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        voice: [af_heart, bf_emma, bm_george, am_michael]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and the TTS runtime
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install -q kokoro-onnx soundfile numpy

      - name: Download the Kokoro model
        run: |
          curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Render missing clips
        run: python tools/gen_voices.py kokoro-v1.0.onnx voices-v1.0.bin ${{ matrix.voice }}

      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.voice }}
          path: voice/${{ matrix.voice }}
          retention-days: 3

  commit:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: rendered

      - name: Commit the new clips
        run: |
          for v in af_heart bf_emma bm_george am_michael; do
            mkdir -p "voice/$v"
            cp -n rendered/voice-$v/*.ogg "voice/$v/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice
          if git diff --cached --quiet; then echo "No new clips."; exit 0; fi
          git commit -m "Narration: render new spoken cues (Kokoro-82M)"
          git push
